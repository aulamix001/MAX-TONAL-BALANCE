name: Windows VST3
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3 bundles and all 38 provisional targets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item 'build/TBC_Track_artefacts/Release/VST3/*.vst3' package -Recurse
          Copy-Item 'build/TBC_Master_artefacts/Release/VST3/*.vst3' package -Recurse
          Copy-Item resources/targets package -Recurse
          Copy-Item README.md package
          Compress-Archive -Path package/* -DestinationPath MAX-Tonal-Balance-Windows-x64-VST3-PREVIEW.zip
          Get-FileHash MAX-Tonal-Balance-Windows-x64-VST3-PREVIEW.zip -Algorithm SHA256 | Format-List | Out-File SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MAX-Tonal-Balance-Windows-x64-VST3-PREVIEW
          path: |
            MAX-Tonal-Balance-Windows-x64-VST3-PREVIEW.zip
            SHA256.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-preview')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MAX-Tonal-Balance-Windows-x64-VST3-PREVIEW
          path: release
      - name: Publish clearly marked development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --prerelease --title "Windows VST3 development preview" --notes 'Development preview only: passthrough, themed editor, saved target selection and 38 original provisional target seeds (22 Master, 16 Track). Live FFT analysis, EQ, dynamics, IPC and system capture are NOT implemented. Not the finished suite. Copy .vst3 bundles to C:\Program Files\Common Files\VST3. Unsigned binaries.'
